      var link = e.target.closest('[href^="#"]');
      if (link) {
        e.preventDefault();
        var target = document.getElementById(link.getAttribute('href').slice(1));
        if (target) { target.scrollIntoView(); }
      }
      var topLink = e.target.closest('.back-to-top-link');
      if (topLink) {
        e.preventDefault();
        window.scrollTo(0, 0);
      }
    });
