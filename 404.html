<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Not Found</title>
  <meta name="description" content="404 - Not Found">
  <meta property="og:title" content="404 - Not Found">
  <meta property="og:description" content="404 - Not Found">
  <meta property="og:type" content="article">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="404 - Not Found">
  <meta name="twitter:description" content="404 - Not Found">
  <link rel="stylesheet" href="/blog-priv/style.css">
  <link rel="stylesheet" href="/blog-priv/hljs.css">
  <script>
    // TOC anchor links — scroll without touching history
    document.addEventListener('click', function(e) {
      var link = e.target.closest('[href^="#"]');
      if (link) {
        e.preventDefault();
        var target = document.getElementById(link.getAttribute('href').slice(1));
        if (target) { target.scrollIntoView(); }
      }
      var topLink = e.target.closest('.back-to-top-link');
      if (topLink) {
        e.preventDefault();
        window.scrollTo(0, 0);
      }
    });
  </script>
</head>
<body>
  
    <main>
      <h1>404</h1>
      <p>Page not found.</p>
      <a href="/blog-priv/">← Go home</a>
    </main>
  
</body>
</html>
